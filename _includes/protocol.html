{% assign t = site.data[page.lang] %}

<section id="protocol" class="relative z-10 py-20 md:py-32 overflow-hidden">
  <div class="w-full px-6 md:px-[100px]">
    <div class="flex flex-col md:flex-row gap-10 md:gap-[10%] items-start">

      <!-- Left: 3 Cards -->
      <div class="w-full md:w-[37.5%] flex flex-col gap-6">
        {% for card in t.protocol.cards %}
        <div class="protocol-card relative" style="border-radius: 16px; padding: 2rem 2.5rem;">
          <!-- Card background (fades in) -->
          <div class="protocol-card-bg" style="position:absolute; inset:0; background: rgba(255,255,255,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: inherit; opacity:0;"></div>
          <!-- Corner dots -->
          <span class="protocol-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; left:15px;"></span>
          <span class="protocol-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; right:15px;"></span>
          <span class="protocol-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; left:15px;"></span>

          <h3 class="protocol-card-title relative text-base md:text-lg font-bold uppercase tracking-wide text-melt-black mb-3">{{ card.title }}</h3>
          <p class="protocol-card-text relative text-sm md:text-base text-melt-black/80 leading-relaxed" style="overflow-wrap: break-word; word-break: normal;">{{ card.text }}</p>
        </div>
        {% endfor %}
      </div>

      <!-- Right: Protocol info -->
      <div class="w-full md:w-[52.5%]">
        <!-- Section indicator -->
        <div id="protocol-badge" class="inline-flex items-center gap-2 mb-6 px-3 py-2 rounded-[8px]" style="background: rgba(220, 250, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.4); opacity: 0;">
          <span class="w-4 h-4 rounded-[4px] bg-[#05EEFF]"></span>
          <span class="text-[13px] font-semibold uppercase tracking-wider text-melt-black">{{ t.protocol.label }}</span>
        </div>

        <!-- Title -->
        <h2 id="protocol-title" class="text-[2rem] sm:text-4xl md:text-5xl lg:text-[3.5rem] xl:text-[4rem] uppercase leading-[1.05] tracking-tight text-melt-black mb-6" style="opacity: 0;">{{ t.protocol.title }}</h2>

        <!-- Description -->
        <p id="protocol-desc" class="text-sm md:text-base text-melt-black/70 leading-relaxed mb-8" style="overflow-wrap: break-word; word-break: normal; opacity: 0;">
          {{ t.protocol.description_html }}
        </p>

        <!-- CTA -->
        <a id="protocol-cta" href="#" class="btn-liquid inline-flex items-center justify-center px-[28px] rounded-[6px] text-[14px] font-semibold bg-melt-black text-white" style="height: 40px; opacity: 0;">
          <span class="btn-blob-inner"><span class="btn-blob-group"><span class="btn-blob"></span><span class="btn-blob"></span><span class="btn-blob"></span><span class="btn-blob"></span></span></span>
          {{ t.protocol.cta }}
        </a>
      </div>

    </div>
  </div>
</section>

<!-- Protocol GSAP animations -->
<script>
  document.addEventListener('DOMContentLoaded', function () {

    // Char split helper (same technique as hero card)
    function splitTextIntoChars(el, className) {
      Array.from(el.childNodes).forEach(function(node) {
        if (node.nodeType === 3) { // text node
          var frag = document.createDocumentFragment();
          var words = node.textContent.split(/( )/);
          words.forEach(function(word) {
            if (word === ' ') {
              frag.appendChild(document.createTextNode(' '));
            } else if (word.length > 0) {
              var wordSpan = document.createElement('span');
              wordSpan.style.cssText = 'display:inline-block; white-space:nowrap;';
              word.split('').forEach(function(ch) {
                var outer = document.createElement('span');
                outer.style.cssText = 'display:inline-block; overflow:hidden; vertical-align:bottom;';
                var inner = document.createElement('span');
                inner.className = className;
                inner.style.display = 'inline-block';
                inner.textContent = ch;
                outer.appendChild(inner);
                wordSpan.appendChild(outer);
              });
              frag.appendChild(wordSpan);
            }
          });
          el.replaceChild(frag, node);
        } else if (node.nodeType === 1) {
          splitTextIntoChars(node, className);
        }
      });
    }

    // Cards: hero-style animation (bg fade → dots pop → text char-by-char)
    var cards = document.querySelectorAll('.protocol-card');
    cards.forEach(function(card, i) {
      var bg = card.querySelector('.protocol-card-bg');
      var dots = card.querySelectorAll('.protocol-dot');
      var title = card.querySelector('.protocol-card-title');
      var text = card.querySelector('.protocol-card-text');

      // Split title and text into chars
      splitTextIntoChars(title, 'pcard-char');
      splitTextIntoChars(text, 'pcard-char');
      var chars = card.querySelectorAll('.pcard-char');

      // Initial states
      gsap.set(dots, { opacity: 0, scale: 0 });
      gsap.set(chars, { y: '110%', rotation: 8, opacity: 0 });

      // Timeline triggered on scroll per card
      var cardTl = gsap.timeline({
        scrollTrigger: {
          trigger: card,
          start: 'top 85%',
          toggleActions: 'play none none none'
        },
        delay: i * 0.08
      });

      // 1. Background fade in
      cardTl.to(bg, { opacity: 1, duration: 0.3, ease: 'power2.out' });

      // 2. Dots pop in
      cardTl.to(dots, {
        opacity: 1, scale: 1, duration: 0.15, stagger: 0.05, ease: 'back.out(2)',
      }, '-=0.1');

      // 3. Text char-by-char
      cardTl.to(chars, {
        y: '0%', rotation: 0, opacity: 1,
        duration: 0.45, stagger: 0.002, ease: 'power1.out',
      }, '-=0.05');
    });

    // Badge fade up
    gsap.set('#protocol-badge', { opacity: 0, y: 30 });
    gsap.to('#protocol-badge', {
      opacity: 1, y: 0, duration: 0.6, ease: 'power2.out',
      scrollTrigger: {
        trigger: '#protocol',
        start: 'top 75%',
        toggleActions: 'play none none none'
      },
      delay: 0.2
    });

    // Title: char-by-char reveal (same as hero)
    var protoTitle = document.getElementById('protocol-title');
    var protoText = protoTitle.innerText.trim();
    var protoWords = protoText.split(/\s+/);
    protoTitle.innerHTML = protoWords.map(function(word) {
      var chars = word.split('').map(function(char) {
        return '<span style="display:inline-block; overflow:hidden; vertical-align:bottom;">' +
               '<span class="proto-char-inner" style="display:inline-block;">' + char + '</span>' +
               '</span>';
      }).join('');
      return '<span style="display:inline-block; margin-right:0.25em;">' + chars + '</span>';
    }).join('');
    protoTitle.style.opacity = '1';

    var protoChars = protoTitle.querySelectorAll('.proto-char-inner');
    gsap.set(protoChars, { y: '110%', rotation: 8, opacity: 0 });
    gsap.to(protoChars, {
      y: '0%', rotation: 0, opacity: 1,
      duration: 0.7, stagger: 0.01, ease: 'power1.out',
      scrollTrigger: {
        trigger: '#protocol',
        start: 'top 75%',
        toggleActions: 'play none none none'
      },
      delay: 0.35
    });

    // Desc + CTA fade up
    var rightElements = ['#protocol-desc', '#protocol-cta'];
    rightElements.forEach(function(sel, i) {
      gsap.set(sel, { opacity: 0, y: 30 });
      gsap.to(sel, {
        opacity: 1, y: 0, duration: 0.6, ease: 'power2.out',
        scrollTrigger: {
          trigger: '#protocol',
          start: 'top 75%',
          toggleActions: 'play none none none'
        },
        delay: 0.8 + i * 0.15
      });
    });

  });
</script>
