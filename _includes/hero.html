{% assign t = site.data[page.lang] %}

<section id="hero" class="relative min-h-screen overflow-hidden">

  {% include unicorn-bg.html %}

  <!-- CONTENT WRAPPER
       Mobile  : flex column centré, scroll naturel
       Desktop : absolute inset avec max-w 1350px
  -->
  <div class="relative z-10 max-w-[1350px] mx-auto
              flex flex-col items-center justify-center gap-10 px-6 pt-28 pb-24 min-h-screen
              md:absolute md:inset-0 md:flex-none md:items-stretch md:justify-start md:px-0 md:pt-0 md:pb-0">

    <!-- HEADLINE -->
    <div class="text-center md:text-left md:absolute md:top-[18%] md:left-12 md:max-w-[52%] w-full">
      <h1 id="hero-headline" class="text-[2rem] sm:text-4xl md:text-5xl lg:text-[3.5rem] xl:text-[4rem] uppercase leading-[1.05] tracking-tight text-melt-black mb-6">
        {{ t.hero.headline }}
      </h1>
      <a id="hero-cta-primary" href="#" class="bg-melt-primary inline-flex items-center px-5 py-2.5 rounded-[10px] border border-melt-black/30 text-sm font-semibold text-melt-black hover:bg-melt-black hover:text-melt-white transition-all duration-200" style="opacity:0;">
        {{ t.hero.cta_primary }}
      </a>
    </div>

    <!-- =====================================================
         CARD + SOCIALS — Desktop : bloc unifié avec clip-path
                           Mobile  : card simple + socials horizontaux
    ====================================================== -->

    <!-- MOBILE card (simple, sans shape) -->
    <div class="gsap-fade-in w-full max-w-sm md:hidden">
      <div class="relative rounded-2xl bg-white/30 backdrop-blur-md px-6 py-8">
        <span class="absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; left:15px;"></span>
        <span class="absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; right:15px;"></span>
        <span class="absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; left:15px;"></span>
        <span class="absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; right:15px;"></span>
        <p class="text-sm text-melt-black/80 leading-relaxed mb-4">{{ t.hero.subheadline_html }}</p>
        <a href="#" class="inline-flex items-center px-5 py-2.5 rounded-[10px] bg-melt-black text-melt-white text-sm font-semibold hover:bg-melt-black/80 transition-colors duration-200">
          {{ t.hero.cta_secondary }}
        </a>

      </div>
    </div>

    <!-- DESKTOP card + socials — bloc unifié avec fond biseauté -->
    <div id="hero-card-desktop" class="hidden md:block absolute bottom-10 right-12" style="width: 480px;">

      <!-- Fond biseauté -->
      <div id="card-bg" style="
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
      "></div>

      <!-- Corner dots -->
      <span class="card-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; left:15px; z-index:1;"></span>
      <span class="card-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; right:15px; z-index:1;"></span>
      <span class="card-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; left:15px; z-index:1;"></span>

      <!-- Contenu texte -->
      <div style="position:relative; z-index:1; width:100%; padding: 2rem 1.5rem 2rem 1.5rem;">
        <p id="card-text-p" class="text-sm md:text-base text-melt-black/80 leading-relaxed mb-5">
          {{ t.hero.subheadline_html }}
        </p>

        <!-- BUTTONS -->
        <div id="card-btn-area" class="flex flex-wrap items-center gap-3" style="opacity:0;">
          <a href="#" class="inline-flex items-center px-5 py-2 rounded-[10px] bg-melt-black text-melt-white text-sm font-semibold hover:bg-melt-black/80 transition-colors duration-200">
            {{ t.hero.cta_secondary }}
          </a>
          <!-- <a href="#" class="inline-flex items-center px-5 py-2.5 rounded-[10px] border border-melt-black/30 text-sm font-semibold text-melt-black hover:bg-melt-black/5 transition-colors duration-200">Autre bouton</a> -->
        </div>
      </div>

      <!-- Socials -->
      <div style="position:absolute; z-index:1; right:0; bottom:0; width:30%; height:26%; display:flex; align-items:center; justify-content:center; gap:20px;">
        <a href="{{ t.socials.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"
           class="card-social text-melt-black/50 hover:text-melt-black transition-colors duration-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286ZM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065Zm1.782 13.019H3.555V9h3.564v11.452ZM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003Z"/></svg>
        </a>
        <a href="{{ t.socials.x }}" target="_blank" rel="noopener noreferrer" aria-label="X"
           class="card-social text-melt-black/50 hover:text-melt-black transition-colors duration-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.738l7.746-8.867L2.25 2.25h6.937l4.266 5.644L18.244 2.25Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg>
        </a>
        <a href="{{ t.socials.discord }}" target="_blank" rel="noopener noreferrer" aria-label="Discord"
           class="card-social text-melt-black/50 hover:text-melt-black transition-colors duration-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.491a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 2.98.078.078 0 0 0 .084-.026 13.83 13.83 0 0 0 1.226-1.963.074.074 0 0 0-.041-.104 13.175 13.175 0 0 1-1.872-.878.075.075 0 0 1-.008-.125c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.764 8.18 1.764 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.075.075 0 0 1-.006.125c-.598.344-1.22.635-1.873.877a.075.075 0 0 0-.041.105c.36.687.772 1.341 1.225 1.962a.077.077 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-2.981.076.076 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.06.06 0 0 0-.031-.028ZM8.02 15.278c-1.182 0-2.157-1.069-2.157-2.38 0-1.312.956-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.956 2.38-2.157 2.38Zm7.975 0c-1.183 0-2.157-1.069-2.157-2.38 0-1.312.955-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.946 2.38-2.157 2.38Z"/></svg>
        </a>
      </div>

    </div>

  </div>

</section>

<!-- GSAP animations -->
<script>
  document.addEventListener('DOMContentLoaded', function () {

    gsap.from('#navbar', { opacity: 0, duration: 1.2, ease: 'power2.out' });

    var h1 = document.getElementById('hero-headline');
    var words = h1.innerText.trim().split(/\s+/);

    h1.innerHTML = words.map(function(word) {
      var chars = word.split('').map(function(char) {
        return '<span class="char" style="display:inline-block; overflow:hidden; vertical-align:bottom;">' +
               '<span class="char-inner" style="display:inline-block;">' + char + '</span>' +
               '</span>';
      }).join('');
      return '<span class="word" style="display:inline-block; margin-right:0.25em;">' + chars + '</span>';
    }).join('');

    var charInners = h1.querySelectorAll('.char-inner');
    gsap.set(charInners, { y: '110%', rotation: 8, opacity: 0 });

    // --- Split card text into chars (preserves <strong> etc.) ---
    function splitIntoChars(el) {
      Array.from(el.childNodes).forEach(function(node) {
        if (node.nodeType === 3) { // text node
          var frag = document.createDocumentFragment();
          node.textContent.split('').forEach(function(ch) {
            if (ch === ' ') {
              frag.appendChild(document.createTextNode(' '));
            } else {
              var outer = document.createElement('span');
              outer.style.cssText = 'display:inline-block; overflow:hidden; vertical-align:bottom;';
              var inner = document.createElement('span');
              inner.className = 'card-char-inner';
              inner.style.display = 'inline-block';
              inner.textContent = ch;
              outer.appendChild(inner);
              frag.appendChild(outer);
            }
          });
          el.replaceChild(frag, node);
        } else if (node.nodeType === 1) {
          splitIntoChars(node);
        }
      });
    }

    var cardP = document.getElementById('card-text-p');
    splitIntoChars(cardP);
    var cardChars = cardP.querySelectorAll('.card-char-inner');

    // Set initial states
    gsap.set('#hero-cta-primary', { y: 5 });
    gsap.set('.card-dot',         { opacity: 0, scale: 0 });
    gsap.set(cardChars,           { y: '110%', rotation: 8, opacity: 0 });
    gsap.set('#card-btn-area',    { y: 5 });
    gsap.set('.card-social',      { opacity: 0, y: 8 });

    // --- H1 + headline CTA timeline ---
    var tl = gsap.timeline({ delay: 0.1 });

    tl.to(charInners, {
      y: '0%', rotation: 0, opacity: 1,
      duration: 0.7, stagger: 0.01, ease: 'power1.out',
    });

    // Bouton primaire : blur + y, démarre 0.4s avant la fin du titre
    tl.to('#hero-cta-primary', {
      opacity: 1, y: 0, duration: 0.4, ease: 'power2.out',
    }, '-=0.4');

    // Mobile card fade in
    tl.to('.gsap-fade-in', { opacity: 1, duration: 0.6, ease: 'power2.out' }, '-=0.3');

    // --- Card timeline (démarre après le H1) ---
    var cardTl = gsap.timeline({ delay: 0.6 });

    // 1. Fond de la card
    cardTl.to('#card-bg', { opacity: 1, duration: 0.5, ease: 'power2.out' });

    // 2. Points de déco l'un après l'autre
    cardTl.to('.card-dot', {
      opacity: 1, scale: 1, duration: 0.2, stagger: 0.1, ease: 'back.out(2)',
    }, '-=0.1');

    // 3. Texte lettre par lettre
    cardTl.to(cardChars, {
      y: '0%', rotation: 0, opacity: 1,
      duration: 0.7, stagger: 0.003, ease: 'power1.out',
    }, '-=0.05');

    // 4. Bouton secondaire : même anim, démarre 0.4s avant la fin du texte
    cardTl.to('#card-btn-area', {
      opacity: 1, y: 0, duration: 0.4, ease: 'power2.out',
    }, '-=0.4');

    // 5. Socials un par un
    cardTl.to('.card-social', {
      opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: 'power2.out',
    }, '-=0.1');

  });

  // --- Card shape avec coins arrondis via clip-path: path() ---
  function applyCardShape() {
    var card = document.getElementById('hero-card-desktop');
    var bg   = document.getElementById('card-bg');
    if (!card || !bg) return;

    var w  = card.offsetWidth;
    var h  = card.offsetHeight;
    var r  = 12;  // rayon coins extérieurs
    var nr = 10;  // rayon coin intérieur du biseau
    var nx = w * 0.70;  // position X du biseau
    var ny = h * 0.74;  // position Y du biseau

    // Path : rectangle arrondi avec un biseau en bas-droite
    // Quadratic Bézier aux coins : Q cx cy x y
    var d = [
      'M', r, 0,
      'L', w - r, 0,     'Q', w, 0,    w, r,            // coin haut-droit
      'L', w, ny - r,    'Q', w, ny,   w - r, ny,        // coin extérieur du step (arrondi)
      'L', nx + nr, ny,  'Q', nx, ny,  nx, ny + nr,      // coin intérieur du biseau (arrondi)
      'L', nx, h - r,    'Q', nx, h,   nx - r, h,        // coin bas du biseau (arrondi)
      'L', r, h,          'Q', 0, h,   0, h - r,         // coin bas-gauche
      'L', 0, r,          'Q', 0, 0,   r, 0,             // coin haut-gauche
      'Z'
    ].join(' ');

    bg.style.clipPath = 'path("' + d + '")';
  }

  // Appliquer après rendu et au resize
  requestAnimationFrame(function() { requestAnimationFrame(applyCardShape); });
  window.addEventListener('resize', applyCardShape, { passive: true });
</script>
