{% assign t = site.data[page.lang] %}

<footer id="footer" class="relative z-10 pt-10 md:pt-20 pb-0" style="overflow: hidden;">

  <!-- Logo behind card, collé au bas, croppé par le overflow:hidden -->
  <div id="footer-logo" class="pointer-events-none" style="position: absolute; bottom: -25%; left: -10%; right: -2.5%; z-index: 0; display: flex; justify-content: center;">
    <img src="{{ '/assets/images/logofooter.png' | relative_url }}" alt="" style="width: 100%; display: block;" />
  </div>

  <!-- Card wrapper -->
  <div class="w-full px-6 md:px-[100px] relative" style="z-index: 1; padding-bottom: 80px;">

    <!-- Big card container -->
    <div class="footer-card relative" style="border-radius: 16px; padding: 3.5rem 2.5rem 3rem;">
      <!-- Card background (fades in separately) -->
      <div class="footer-card-bg" style="position:absolute; inset:0; background: rgba(255,255,255,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: inherit; opacity:0;"></div>

      <!-- Corner dots -->
      <span class="footer-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; left:15px;"></span>
      <span class="footer-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="top:15px; right:15px;"></span>
      <span class="footer-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; left:15px;"></span>
      <span class="footer-dot absolute w-1.5 h-1.5 rounded-[2px] bg-melt-black/25" style="bottom:15px; right:15px;"></span>

      <!-- Top: title left + description right -->
      <div class="flex flex-col md:flex-row gap-6 md:gap-[10%] items-start mb-20 md:mb-32">
        <!-- Title -->
        <h2 id="footer-title" class="w-full md:w-[55%] text-[2rem] sm:text-4xl md:text-5xl lg:text-[3.5rem] xl:text-[4rem] uppercase leading-[1.05] tracking-tight text-melt-black" style="opacity: 0;">{{ t.footer.title }}</h2>
        <!-- Description -->
        <p id="footer-desc" class="w-full md:w-[35%] text-sm md:text-base text-melt-black/70 leading-relaxed" style="overflow-wrap: break-word; word-break: normal; opacity: 0;">{{ t.footer.description_html }}</p>
      </div>

      <!-- Bottom: 4-column link grid -->
      <div id="footer-links" class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-6" style="opacity: 0;">
        {% for col in t.footer.columns %}
        <div>
          <h4 class="text-sm md:text-base font-bold uppercase tracking-wide text-melt-black mb-4">{{ col.title }}</h4>
          <ul class="flex flex-col gap-2">
            {% for link in col.links %}
            <li>
              <a href="{{ link.url }}" {% if link.url contains "http" %}target="_blank" rel="noopener noreferrer"{% endif %}
                 class="text-sm text-melt-black/60 hover:text-melt-black transition-colors duration-200">
                {{ link.label }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>
        {% endfor %}
      </div>

    </div>

  </div>

</footer>

<!-- Footer GSAP animations -->
<script>
  document.addEventListener('DOMContentLoaded', function () {

    // Char split helper
    function splitFooterChars(el, className) {
      Array.from(el.childNodes).forEach(function(node) {
        if (node.nodeType === 3) {
          var frag = document.createDocumentFragment();
          var words = node.textContent.split(/( )/);
          words.forEach(function(word) {
            if (word === ' ') {
              frag.appendChild(document.createTextNode(' '));
            } else if (word.length > 0) {
              var wordSpan = document.createElement('span');
              wordSpan.style.cssText = 'display:inline-block; white-space:nowrap;';
              word.split('').forEach(function(ch) {
                var outer = document.createElement('span');
                outer.style.cssText = 'display:inline-block; overflow:hidden; vertical-align:bottom;';
                var inner = document.createElement('span');
                inner.className = className;
                inner.style.display = 'inline-block';
                inner.textContent = ch;
                outer.appendChild(inner);
                wordSpan.appendChild(outer);
              });
              frag.appendChild(wordSpan);
            }
          });
          el.replaceChild(frag, node);
        } else if (node.nodeType === 1) {
          splitFooterChars(node, className);
        }
      });
    }

    var footerCard = document.querySelector('.footer-card');
    var footerBg = document.querySelector('.footer-card-bg');
    var footerDots = document.querySelectorAll('.footer-dot');
    var footerLogo = document.getElementById('footer-logo');

    // Initial states
    gsap.set(footerCard, { y: 300 });
    gsap.set(footerLogo, { y: 300 });
    gsap.set(footerDots, { opacity: 0, scale: 0 });
    gsap.set('#footer-links', { opacity: 0, y: 15 });

    // Title char-by-char
    var footerTitle = document.getElementById('footer-title');
    splitFooterChars(footerTitle, 'footer-char-inner');
    footerTitle.style.opacity = '1';
    var footerTitleChars = footerTitle.querySelectorAll('.footer-char-inner');
    gsap.set(footerTitleChars, { y: '110%', rotation: 8, opacity: 0 });

    // Description char-by-char
    var footerDesc = document.getElementById('footer-desc');
    splitFooterChars(footerDesc, 'footer-desc-char');
    footerDesc.style.opacity = '1';
    var footerDescChars = footerDesc.querySelectorAll('.footer-desc-char');
    gsap.set(footerDescChars, { y: '110%', rotation: 8, opacity: 0 });

    // Timeline
    var ftl = gsap.timeline({
      scrollTrigger: {
        trigger: '#footer',
        start: 'top 85%',
        toggleActions: 'play none none none'
      }
    });

    // 1. Logo + Card slide up together
    ftl.to(footerLogo, { y: 0, duration: 1.5, ease: 'power3.out' }, 0);
    ftl.to(footerCard, { y: 0, duration: 1.5, ease: 'power3.out' }, 0);

    // 2. Background fade in
    ftl.to(footerBg, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.3);

    // 3. Dots pop
    ftl.to(footerDots, {
      opacity: 1, scale: 1, duration: 0.15, stagger: 0.04, ease: 'back.out(2)',
    }, 0.4);

    // 4. Title chars — starts during slide-up
    ftl.to(footerTitleChars, {
      y: '0%', rotation: 0, opacity: 1,
      duration: 0.45, stagger: 0.008, ease: 'power1.out',
    }, 0.5);

    // 5. Description chars
    ftl.to(footerDescChars, {
      y: '0%', rotation: 0, opacity: 1,
      duration: 0.35, stagger: 0.002, ease: 'power1.out',
    }, 0.6);

    // 6. Links fade up
    ftl.to('#footer-links', {
      opacity: 1, y: 0, duration: 0.35, ease: 'power2.out',
    }, 0.7);

  });
</script>
