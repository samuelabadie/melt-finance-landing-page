<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Canonical + hreflang -->
  <link rel="canonical" href="{{ site.url }}/{{ page.lang }}/" />
  <link rel="alternate" hreflang="en" href="{{ site.url }}/en/" />
  <link rel="alternate" hreflang="fr" href="{{ site.url }}/fr/" />
  <link rel="alternate" hreflang="es" href="{{ site.url }}/es/" />

  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" />

  <!-- Geist font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'melt-primary':   '#05DAFF',
            'melt-white':     '#F3FDFF',
            'melt-white-alt': '#D6F6FF',
            'melt-black':     '#141A1A',
            'melt-black-alt': '#1E2A2A',
          },
          fontFamily: {
            sans: ['Geist', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #F3FDFF;
      color: #141A1A;
      font-family: 'Geist', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Nav keeps its gradient on scroll */

    /* GSAP initial states */
    .gsap-fade-up {
      opacity: 0;
      transform: translateY(28px);
    }
    .gsap-fade-in {
      opacity: 0;
    }
  </style>

  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body class="bg-melt-white text-melt-black font-sans antialiased">

  {% assign t = site.data[page.lang] %}
  {% include nav.html %}

  {{ content }}

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Navbar scroll effect -->
  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });
  </script>

  <!-- Lang switcher mobile — sticky bottom-right, hidden on desktop -->
  {% assign t = site.data[page.lang] %}
  <div class="fixed bottom-5 right-5 z-50 md:hidden flex items-center gap-1 px-3 py-2 rounded-[10px] bg-white/50 backdrop-blur-sm border border-melt-black/10 text-xs font-medium text-melt-black/40">
    <a href="/en/" class="px-1 transition-colors duration-150 {% if page.lang == 'en' %}text-melt-black{% else %}hover:text-melt-black/70{% endif %}">EN</a>
    <span class="text-melt-black/20">/</span>
    <a href="/fr/" class="px-1 transition-colors duration-150 {% if page.lang == 'fr' %}text-melt-black{% else %}hover:text-melt-black/70{% endif %}">FR</a>
    <span class="text-melt-black/20">/</span>
    <a href="/es/" class="px-1 transition-colors duration-150 {% if page.lang == 'es' %}text-melt-black{% else %}hover:text-melt-black/70{% endif %}">ES</a>
  </div>

  {% if page.extra_js %}{{ page.extra_js }}{% endif %}
</body>
</html>
